<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tərcümə Aləti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            transition: background-color 0.5s, color 0.5s;
        }
        
        .dark-mode {
            background-color: #121212 !important;
            color: #f1f1f1 !important;
        }
        
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: background-color 0.3s, transform 0.3s;
        }
        
        .theme-toggle:hover {
            transform: rotate(20deg) scale(1.1);
        }
    </style>
</head>

<body class="bg-light">
    <button id="themeBtn" class="btn btn-warning theme-toggle">
    <i class="bi bi-sun-fill"></i>
  </button>

    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h3 class="mb-0">🌍 Tərcümə Aləti</h3>
                <select id="langSelect" class="form-select w-auto">
          <option value="en">İngilis</option>
          <option value="ru">Rus</option>
          <option value="az" selected>Azərbaycan</option>
        </select>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <input type="text" class="form-control" id="inputWord" placeholder="Sözü daxil edin (məsələn: salam)">
                </div>
                <button class="btn btn-success w-100" onclick="translateWord()">Tərcümə et</button>
                <div id="result" class="mt-3 fw-bold text-center"></div>
            </div>
            <div class="card-footer text-center text-muted">
                Hazırlayan: <span class="fw-semibold">Toğrul & Aliko</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>

    <script>
        const dictionary = {
            "salam": {
                "en": "hello",
                "ru": "привет",
                "az": "salam"
            },
            "sağol": {
                "en": "thank you",
                "ru": "спасибо",
                "az": "sağol"
            },
            "gün": {
                "en": "day",
                "ru": "день",
                "az": "gün"
            },
            "gecə": {
                "en": "night",
                "ru": "ночь",
                "az": "gecə"
            },
            "ev": {
                "en": "house",
                "ru": "дом",
                "az": "ev"
            },
            "kitab": {
                "en": "book",
                "ru": "книга",
                "az": "kitab"
            },
            "dost": {
                "en": "friend",
                "ru": "друг",
                "az": "dost"
            },
            "su": {
                "en": "water",
                "ru": "вода",
                "az": "su"
            },
            "sevgi": {
                "en": "love",
                "ru": "любовь",
                "az": "sevgi"
            }
        };

        function translateWord() {
            const input = document.getElementById("inputWord").value.trim().toLowerCase();
            const lang = document.getElementById("langSelect").value;
            const resultDiv = document.getElementById("result");

            if (!input) {
                resultDiv.innerHTML = `<div class="alert alert-warning">⚠️ Zəhmət olmasa, bir söz daxil edin.</div>`;
                return;
            }

            if (dictionary[input]) {
                resultDiv.innerHTML = `<div class="alert alert-info"><strong>${input}</strong> → <strong>${dictionary[input][lang]}</strong></div>`;
            } else {
                resultDiv.innerHTML = `<div class="alert alert-danger">❌ Bu sözü tərcümə edə bilmirik.</div>`;
            }
        }

        const themeBtn = document.getElementById("themeBtn");
        let darkMode = false;

        themeBtn.addEventListener("click", () => {
            darkMode = !darkMode;
            document.body.classList.toggle("dark-mode", darkMode);
            themeBtn.classList.toggle("btn-warning", !darkMode);
            themeBtn.classList.toggle("btn-dark", darkMode);
            themeBtn.innerHTML = darkMode ?
                '<i class="bi bi-moon-stars-fill"></i>' :
                '<i class="bi bi-sun-fill"></i>';
        });
    </script>
</body>

</html>
